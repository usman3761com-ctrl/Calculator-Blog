<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Value Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-card">
        <h2>Two Value Calculator</h2>

        <!-- Input 1 -->
        <div class="input-group">
            <label for="num1">Enter First Value:</label>
            <input type="number" id="num1" placeholder="e.g. 10">
        </div>

        <!-- Input 2 -->
        <div class="input-group">
            <label for="num2">Enter Second Value:</label>
            <input type="number" id="num2" placeholder="e.g. 5">
        </div>

        <!-- Operation Buttons -->
        <div class="button-group">
            <button class="btn add" onclick="calculate('+')">Add (+)</button>
            <button class="btn sub" onclick="calculate('-')">Subtract (-)</button>
            <button class="btn mul" onclick="calculate('*')">Multiply (&times;)</button>
            <button class="btn div" onclick="calculate('/')">Divide (&divide;)</button>
        </div>

        <!-- Result Box -->
        <div class="result-box">
            <h3>Result: <span id="resultValue">0</span></h3>
        </div>

        <!-- Clear Button -->
        <button class="btn clear" onclick="clearAll()">Clear All</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
